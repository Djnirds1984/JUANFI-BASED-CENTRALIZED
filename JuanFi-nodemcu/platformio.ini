; PlatformIO Project Configuration File
; JuanFi Custom Firmware with Safe OTA

[platformio]
default_envs = esp8266_wifi
src_dir = .
data_dir = data

[env:esp8266_wifi]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
board_build.filesystem = spiffs
lib_deps =
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
  https://github.com/videojedi/ESP8266-Telnet-Client.git
build_flags =
  -DESP8266
  -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
  -D OTA_PORT=3232
  -Wno-error=return-type
board_build.ldscript = eagle.flash.4m2m.ld

[env:esp32_lan]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = spiffs
lib_deps =
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
  https://github.com/khoih-prog/EthernetWebServer.git@^1.5.2
build_flags =
  -DESP32
  -D USE_ETHERNET
  -D USE_ETHERNET_WEBSERVER
  -D OTA_PORT=3232
