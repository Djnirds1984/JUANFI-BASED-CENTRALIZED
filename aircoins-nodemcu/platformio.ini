; AirCoins sub-vendo firmware.
;
; A board that was never registered boots into the `Aircoins_setup` access point.
; The installer joins it, picks the shop WiFi from a scan list, and the board
; asks the panel to accept it. An admin accepts on the AirCoins subpage, the
; panel hands back a device key, and the board reboots into normal mode - where
; it has no admin page and no inbound port: it only polls the panel.
;
; The same portal is used as a waiting room when a shop router is slow to boot
; (a blackout takes the ONU down with the vendo), and firmware updates are
; pulled from the panel over that status link - both need nothing but the
; address the machine already has.
;
; Note: the linker script is the plain 4m2m one. The OTA image lands in the
; ~1 MB gap between the running sketch and SPIFFS, which is what
; ESP.getFreeSketchSpace() reports, so no OTA-specific layout is needed and the
; EEPROM config sector at the end of flash is never touched.

[platformio]
default_envs = esp8266
; The Arduino sketch IS the firmware source: the same file you open in the
; Arduino IDE is the one built here, so there is only ever one copy.
src_dir = aircoins_esp8266

[env:esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
build_flags =
  -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH
lib_deps =
  bblanchon/ArduinoJson@^6.21.5
board_build.ldscript = eagle.flash.4m2m.ld
