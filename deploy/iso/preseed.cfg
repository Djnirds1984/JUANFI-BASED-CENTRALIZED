# JuanFi Panel — Debian Installer Preseed
# Provides non-critical defaults (language, keyboard) so the installer
# skips straight to disk selection. The late_command installs JuanFi
# automatically after the base system is written to disk.

d-i debian-installer/language string en
d-i debian-installer/country string US
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

d-i finish-install/reboot_in_progress note

# Run JuanFi post-install after base system is written to disk.
# Copies app files from the ISO into /target, then runs setup inside the chroot.
d-i preseed/late_command string \
    cp -a /target/opt/juanfi-installer/* /target/opt/ 2>/dev/null || true; \
    in-target bash /opt/juanfi-installer/post-install.sh
