<body id="loginBody">

    <form name="sendin" action="" method="post" style="display:none">
        <input type="hidden" name="username" />
        <input type="hidden" name="password" />
        <input type="hidden" name="dst" value="/status" />
    </form>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
				<div class="main-card">
					<div class="row align-items-center">
						<div class="col-sm-5 text-center">
							<div class="brand-img-container">
								<img src="/hotspot-assets/assets/MainPic.PNG" class="img-fluid rounded" alt="Aircoins Logo" />
							</div>

							<div class="info">
								<div class="d-flex align-items-center justify-content-center mb-1">
									<img src="/hotspot-assets/assets/img/ip.png" width="18px" height="18px" class="mr-2" />
									<span id="ip-display">-</span>
								</div>
								<div class="d-flex align-items-center justify-content-center">
									<img src="/hotspot-assets/assets/img/mac.png" width="18px" height="18px" class="mr-2" />
									<span id="mac-display">-</span>
								</div>
							</div>

							<div class="mb-4">
								<span class="status-badge">Status: <span class="blinking1 text-danger font-weight-bold">Disconnected</span></span>
							</div>
						</div>

						<div class="col-sm-7">
							<div class="login">
								<div id="vendoSelectDiv" class="form-group">
									<label for="vendoSelected">Select Vendo</label>
									<select class="form-control" name="vendoSelected" id="vendoSelected">
									</select>
								</div>

								<button type="button" id="insertBtn" class="btn btn-success btn-block">INSERT COIN</button>
								<div class="mt-3"></div>

								<button type="button" id="promoRateBtn" class="btn portal-btn mb-3">PROMO RATES</button>
								<button type="button" id="chargingBtn" class="btn portal-btn mb-3">CHARGING STATION</button>
								<button type="button" id="eloadBtn" class="btn portal-btn mb-3">E-LOAD</button>

								<div class="form-group mt-4">
									<span class="form-text voucher-section-label mb-1">VOUCHER CODE</span>
									<input type="text" class="form-control" id="voucherInput" aria-describedby="voucherHelp" placeholder="Enter voucher code..">
									<small id="voucherHelp" class="form-text text-muted mt-1 px-1">Please enter voucher code if you have an existing one.</small>
									<button type="button" id="connectBtn" class="btn portal-btn mt-3">CONNECT</button>
								</div>
							</div>
						</div>
					</div>
				</div>

				<div class="footer">
					<span class="footers">
					Powered by: <a href="https://www.facebook.com/groups/1172413279934139">JuanFi System v4.1</a> &copy; All rights reserved 2022
					</span>
				</div>
            </div>
        </div>

		<script>
			// Extract CHAP parameters from URL
			const params = new URLSearchParams(window.location.search);
			const mac = params.get('mac') || '';
			const ip = params.get('ip') || '';
			const chapId = params.get('chap-id') || '';
			const chapChallenge = params.get('chap-challenge') || '';
			const linkLoginOnly = params.get('link-login-only') || '';
			const linkStatus = params.get('link-status') || '/status';
			const routerId = params.get('router-id') || '';

			// Display device info
			document.getElementById('ip-display').textContent = ip || '-';
			document.getElementById('mac-display').textContent = mac || '-';

			// Set form action
			document.sendin.action = linkLoginOnly;

			// Login function
			function doLogin() {
				var vc = document.getElementById('voucherInput').value.trim();
				if (!vc) {
					alert('Please enter a voucher code');
					return false;
				}

				document.sendin.username.value = vc;
				document.sendin.password.value = hexMD5(chapId + vc + chapChallenge);
				document.sendin.dst.value = "/status";
				document.sendin.submit();
				return false;
			}

			// Connect button
			document.getElementById('connectBtn').addEventListener('click', function() {
				doLogin();
			});

			// Enter key on voucher input
			document.getElementById('voucherInput').addEventListener('keypress', function(e) {
				if (e.key === 'Enter') {
					doLogin();
				}
			});
		</script>
	</div>
