<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Aircoins WiFi</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
		}
		.container {
			background: white;
			border-radius: 20px;
			padding: 40px 30px;
			max-width: 400px;
			width: 100%;
			box-shadow: 0 20px 60px rgba(0,0,0,0.3);
		}
		.logo {
			text-align: center;
			margin-bottom: 30px;
		}
		.logo h1 {
			color: #667eea;
			font-size: 32px;
			font-weight: 700;
		}
		.logo p {
			color: #666;
			font-size: 14px;
			margin-top: 5px;
		}
		.form-group {
			margin-bottom: 20px;
		}
		.form-group label {
			display: block;
			color: #333;
			font-weight: 600;
			margin-bottom: 8px;
			font-size: 14px;
		}
		.form-group input {
			width: 100%;
			padding: 12px 15px;
			border: 2px solid #e0e0e0;
			border-radius: 10px;
			font-size: 16px;
			transition: border-color 0.3s;
		}
		.form-group input:focus {
			outline: none;
			border-color: #667eea;
		}
		.btn {
			width: 100%;
			padding: 14px;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: white;
			border: none;
			border-radius: 10px;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			transition: transform 0.2s;
		}
		.btn:hover {
			transform: translateY(-2px);
		}
		.btn:active {
			transform: translateY(0);
		}
		.btn:disabled {
			opacity: 0.6;
			cursor: not-allowed;
			transform: none;
		}
		.error {
			background: #fee;
			color: #c33;
			padding: 12px;
			border-radius: 8px;
			margin-bottom: 20px;
			font-size: 14px;
			display: none;
		}
		.error.show {
			display: block;
		}
		.info {
			background: #e7f3ff;
			color: #0066cc;
			padding: 12px;
			border-radius: 8px;
			margin-top: 20px;
			font-size: 13px;
			text-align: center;
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="logo">
			<h1>Aircoins WiFi</h1>
			<p>Enter your voucher code to connect</p>
		</div>
		
		<div id="errorMsg" class="error"></div>
		
		<form id="loginForm">
			<div class="form-group">
				<label>Voucher Code</label>
				<input type="text" id="voucherInput" placeholder="Enter voucher code" autocomplete="off" required>
			</div>
			
			<button type="submit" class="btn" id="loginBtn">Connect</button>
		</form>
		
		<div class="info">
			Insert coin to get your voucher code
		</div>
	</div>

	<!-- Hidden form for MikroTik login -->
	<form name="sendin" action="" method="post" style="display:none">
		<input type="hidden" name="username" />
		<input type="hidden" name="password" />
		<input type="hidden" name="dst" value="/status" />
		<input type="hidden" name="popup" value="true" />
	</form>

	<script src="/hotspot-assets/js/md5.js"></script>
	<script>
		const urlParams = new URLSearchParams(window.location.search);
		const mac = urlParams.get('mac') || '';
		const ip = urlParams.get('ip') || '';
		const chapId = urlParams.get('chap-id') || '';
		const chapChallenge = urlParams.get('chap-challenge') || '';
		const linkLoginOnly = urlParams.get('link-login-only') || '';
		const linkStatus = urlParams.get('link-status') || '';
		
		console.log('[portal] MAC:', mac, 'IP:', ip, 'CHAP-ID:', chapId, 'CHAP-Challenge:', chapChallenge);
		
		// Set the form action to MikroTik's login endpoint
		if (linkLoginOnly) {
			document.sendin.action = linkLoginOnly;
		}
		
		const form = document.getElementById('loginForm');
		const voucherInput = document.getElementById('voucherInput');
		const loginBtn = document.getElementById('loginBtn');
		const errorMsg = document.getElementById('errorMsg');
		
		form.addEventListener('submit', function(e) {
			e.preventDefault();
			
			const voucher = voucherInput.value.trim();
			if (!voucher) {
				showError('Please enter a voucher code');
				return;
			}
			
			loginBtn.disabled = true;
			loginBtn.textContent = 'Connecting...';
			hideError();
			
			// Submit to MikroTik login with CHAP
			doLogin(voucher);
		});
		
		function doLogin(username) {
			console.log('[portal] Logging in:', username);
			
			// Fill the hidden form
			document.sendin.username.value = username;
			
			// Generate CHAP-MD5 password
			if (chapId && chapChallenge) {
				document.sendin.password.value = hexMD5(chapId + username + chapChallenge);
			} else {
				// No CHAP, send empty password
				document.sendin.password.value = '';
			}
			
			// Submit the form
			document.sendin.submit();
		}
		
		function showError(msg) {
			errorMsg.textContent = msg;
			errorMsg.classList.add('show');
		}
		
		function hideError() {
			errorMsg.classList.remove('show');
		}
	</script>
</body>
</html>
