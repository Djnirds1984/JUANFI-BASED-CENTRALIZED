<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Redirecting...</title>
	<script>
		// Collect CHAP parameters from MikroTik
		var params = new URLSearchParams();
		params.set('mac', '$(mac)');
		params.set('ip', '$(ip)');
		params.set('chap-id', '$(chap-id)');
		params.set('chap-challenge', '$(chap-challenge)');
		params.set('link-login-only', '$(link-login-only)');
		params.set('link-status', '$(link-status)');
		params.set('router-id', 'ROUTER_ID_PLACEHOLDER');
		
		// Redirect to panel portal
		window.location.href = "http://PANEL_URL_PLACEHOLDER:3000/?" + params.toString();
	</script>
	<style>
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			margin: 0;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: white;
		}
		.container {
			text-align: center;
			padding: 2rem;
		}
		.spinner {
			border: 3px solid rgba(255, 255, 255, 0.3);
			border-radius: 50%;
			border-top: 3px solid white;
			width: 40px;
			height: 40px;
			animation: spin 1s linear infinite;
			margin: 0 auto 1rem;
		}
		@keyframes spin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="spinner"></div>
		<h2>Redirecting to login portal...</h2>
		<p style="opacity: 0.8; margin-top: 1rem;">Please wait</p>
	</div>
</body>
</html>
